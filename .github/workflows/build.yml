name: Build MovieTool APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: 🔧 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: ✅ Verify Flutter
        run: flutter doctor -v

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🏗️ Regenerate Android platform
        run: |
          flutter create --platforms android .
          flutter pub get
          # Fix Gradle wrapper version
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          # Remove duplicate XML icon files that conflict with generated PNGs
          rm -f android/app/src/main/res/mipmap-hdpi/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-mdpi/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.xml
          # Fix Android build.gradle
          cat > android/build.gradle << 'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "\${rootProject.buildDir}/\${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          GRADLE

      - name: 📱 Build APK (debug)
        run: flutter build apk --debug

      - name: 📱 Build APK (release)
        run: flutter build apk --release

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: movie-tool-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: 📱 Build App Bundle (release)
        run: flutter build appbundle --release

      - name: 📤 Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: movie-tool-aab
          path: |
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error